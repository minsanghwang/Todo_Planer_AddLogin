{% extends "diary/base.html" %}
{% block title %}로그인 · 플랜두씨 다이어리 2{% endblock %}
{% block body %}
<div class="auth-page"><main class="auth">
  <div class="brand">플랜두씨 다이어리<small>TO-DO &amp; PLAN</small></div>
  <h1>로그인</h1>
  <p class="muted">내 계획과 기록은 로그인한 나만 볼 수 있습니다.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{% url 'login' %}" autocomplete="on">
    {% csrf_token %}
    <label for="username">아이디</label>
    <input id="username" name="username" value="{{ username|default:'' }}" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">로그인</button>
  </form>
  <p class="muted">처음이신가요? <a href="{% url 'signup' %}">가입하기</a></p>
</main></div>
{% endblock %}
