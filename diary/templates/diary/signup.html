{% extends "diary/base.html" %}
{% block title %}가입 · 플랜두씨 다이어리 2{% endblock %}
{% block body %}
<main class="auth">
  <h1>가입하기</h1>
  <p class="muted">아이디는 영문 소문자·숫자·점·밑줄·하이픈 3~30자, 비밀번호는 8자 이상입니다.</p>
  {% if errors %}<div class="error" role="alert">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
  <form method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    <label for="username">아이디</label>
    <input id="username" name="username" value="{{ username|default:'' }}" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <label for="password2">비밀번호 확인</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" required>
    <button class="btn" type="submit">가입</button>
  </form>
  <p class="muted"><a href="{% url 'home' %}">로그인으로 돌아가기</a></p>
</main>
{% endblock %}
